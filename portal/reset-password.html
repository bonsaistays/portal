<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bonsai Portal — Reset Password</title>
  <link rel="stylesheet" href="assets/portal.css" />
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <img src="../PhotosLogos/Bonsa Stays.png" alt="Bonsai Stays" style="height:42px;width:auto;filter:brightness(0) invert(1);display:block;margin:0 auto 8px;" />
    <div class="login-subtitle">Host Portal</div>
    <h2 id="card-title">Set new password</h2>

    <!-- State: loading -->
    <div id="state-loading" style="text-align:center;padding:24px 0;color:var(--g-muted);font-size:0.9rem;">
      Verifying your reset link…
    </div>

    <!-- State: form -->
    <div id="state-form" class="hidden">
      <div id="reset-error" class="login-error hidden" style="margin-bottom:16px;"></div>
      <form id="reset-form" onsubmit="doReset(event)">
        <div style="margin-bottom:16px;">
          <label class="form-label" style="color:var(--g-muted);">New password</label>
          <input class="form-input" id="new-password" type="password" placeholder="At least 8 characters" required autocomplete="new-password" minlength="8" />
        </div>
        <div style="margin-bottom:28px;">
          <label class="form-label" style="color:var(--g-muted);">Confirm new password</label>
          <input class="form-input" id="confirm-password" type="password" placeholder="Repeat your new password" required autocomplete="new-password" minlength="8" />
        </div>
        <button type="submit" class="btn-submit" id="reset-btn">Update password →</button>
      </form>
    </div>

    <!-- State: success -->
    <div id="state-success" class="hidden" style="text-align:center;padding:16px 0;">
      <div style="font-size:2.5rem;margin-bottom:12px;">✅</div>
      <div style="font-size:1rem;font-weight:600;color:#fff;margin-bottom:8px;">Password updated!</div>
      <div style="font-size:0.85rem;color:var(--g-muted);margin-bottom:24px;">You can now sign in with your new password.</div>
      <a href="index.html" class="btn-submit" style="display:inline-block;text-decoration:none;text-align:center;">Go to sign in →</a>
    </div>

    <!-- State: invalid link -->
    <div id="state-invalid" class="hidden" style="text-align:center;padding:16px 0;">
      <div style="font-size:2.5rem;margin-bottom:12px;">🔗</div>
      <div style="font-size:0.95rem;font-weight:600;color:#fff;margin-bottom:8px;">This link has expired</div>
      <div style="font-size:0.83rem;color:var(--g-muted);margin-bottom:24px;">Password reset links expire after 1 hour. Request a new one from the sign-in page.</div>
      <a href="index.html" class="btn-submit" style="display:inline-block;text-decoration:none;text-align:center;">Back to sign in →</a>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL      = 'https://zmbhpebiiyqdfqznruwz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_tfSbR6IES8P_NcseHImJ7w_NzeQRLUA';
const { createClient } = window.supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function show(state) {
  ['loading','form','success','invalid'].forEach(s =>
    document.getElementById('state-' + s).classList.toggle('hidden', s !== state)
  );
}

// Supabase embeds the session tokens in the URL hash after clicking the reset link.
// onAuthStateChange fires with event PASSWORD_RECOVERY when that happens.
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    show('form');
  } else if (event === 'SIGNED_IN' && session) {
    // Already has a valid session — unlikely path but handle gracefully
    show('form');
  }
});

// Fallback: if no token arrives within 4 seconds, show invalid state
const fallback = setTimeout(() => show('invalid'), 4000);

// If the hash contains an access_token, Supabase SDK picks it up automatically.
// Clear the fallback once we know we have a session.
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { clearTimeout(fallback); show('form'); }
})();

async function doReset(e) {
  e.preventDefault();
  const pw1 = document.getElementById('new-password').value;
  const pw2 = document.getElementById('confirm-password').value;
  const err = document.getElementById('reset-error');
  const btn = document.getElementById('reset-btn');

  if (pw1 !== pw2) {
    err.textContent = 'Passwords do not match.';
    err.classList.remove('hidden');
    return;
  }
  if (pw1.length < 8) {
    err.textContent = 'Password must be at least 8 characters.';
    err.classList.remove('hidden');
    return;
  }

  err.classList.add('hidden');
  btn.textContent = 'Updating…'; btn.disabled = true;

  const { error } = await sb.auth.updateUser({ password: pw1 });
  if (error) {
    err.textContent = error.message;
    err.classList.remove('hidden');
    btn.textContent = 'Update password →'; btn.disabled = false;
    return;
  }

  await sb.auth.signOut();
  show('success');
}
</script>

</body>
</html>
