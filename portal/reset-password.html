<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bonsai Stays — Reset Password</title>
  <link rel="stylesheet" href="assets/portal.css" />
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <img src="../PhotosLogos/Logo Black.png" alt="Bonsai Stays" style="height:42px;width:auto;filter:brightness(0) invert(1);display:block;margin:0 auto 8px;" />
    <div class="login-subtitle">Team Portal</div>
    <h2 id="card-title">Set new password</h2>

    <div id="msg-box" class="hidden" style="margin-bottom:16px;padding:12px 14px;border-radius:8px;font-size:0.82rem;text-align:center;line-height:1.5;"></div>

    <form id="reset-form" onsubmit="doReset(event)">
      <div style="margin-bottom:16px;">
        <label class="form-label" style="color:var(--g-muted);">New password</label>
        <input class="form-input" id="new-password" type="password" placeholder="••••••••" required minlength="8" autocomplete="new-password" />
      </div>
      <div style="margin-bottom:28px;">
        <label class="form-label" style="color:var(--g-muted);">Confirm password</label>
        <input class="form-input" id="confirm-password" type="password" placeholder="••••••••" required minlength="8" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn-submit" id="reset-btn">Update password →</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL      = 'https://zmbhpebiiyqdfqznruwz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_tfSbR6IES8P_NcseHImJ7w_NzeQRLUA';

const { createClient } = window.supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showMsg(text, ok) {
  const box = document.getElementById('msg-box');
  box.textContent = text;
  box.style.background  = ok ? 'rgba(91,191,133,0.12)' : 'rgba(220,38,38,0.1)';
  box.style.borderColor = ok ? 'rgba(91,191,133,0.3)'  : 'rgba(220,38,38,0.3)';
  box.style.border      = '1px solid';
  box.style.color       = ok ? '#2e7d52' : '#b91c1c';
  box.classList.remove('hidden');
}

// Supabase fires PASSWORD_RECOVERY when the recovery link is followed
sb.auth.onAuthStateChange(async (event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    // Token is valid — form is already shown, nothing extra needed
  } else if (event === 'SIGNED_IN' && !session) {
    // Invalid or expired link
    document.getElementById('reset-form').style.display = 'none';
    showMsg('This reset link has expired or is invalid. Please request a new one.', false);
    document.getElementById('card-title').textContent = 'Link expired';
  }
});

async function doReset(e) {
  e.preventDefault();
  const pw1 = document.getElementById('new-password').value;
  const pw2 = document.getElementById('confirm-password').value;
  const btn = document.getElementById('reset-btn');

  if (pw1 !== pw2) {
    showMsg('Passwords do not match.', false);
    return;
  }

  btn.textContent = 'Updating…';
  btn.disabled = true;

  const { error } = await sb.auth.updateUser({ password: pw1 });

  if (error) {
    showMsg(error.message || 'Could not update password.', false);
    btn.textContent = 'Update password →';
    btn.disabled = false;
    return;
  }

  document.getElementById('reset-form').style.display = 'none';
  showMsg('✓ Password updated! Redirecting to sign in…', true);
  setTimeout(() => { location.href = 'index.html'; }, 2000);
}
</script>

</body>
</html>
